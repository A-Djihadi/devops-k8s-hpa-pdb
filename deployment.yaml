apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
  labels:
    app: app
    version: "1.0.0"
spec:
  # minReplicas du HPA — ne pas descendre en dessous
  replicas: 2
  selector:
    matchLabels:
      app: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 garantit qu'aucun pod n'est supprimé avant qu'un nouveau soit Ready
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          # OBLIGATOIRE pour que le HPA fonctionne.
          # Sans requests, le HPA ne peut pas calculer le pourcentage d'utilisation.
          resources:
            requests:
              cpu: 100m      # 0.1 vCPU — base de calcul pour le HPA
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
